name: 功能建议
description: 新功能或改进想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先描述场景（孩子多大、在学什么、家长怎么用），再谈方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
